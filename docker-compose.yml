services:
  postgres-db:
    image: postgres-db:15
    restart: always
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: airlinedb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongodb-db:
    image: mongo:7
    restart: always
    container_name: mongodb-db
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - postgres-db
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres-db:5432/airlinedb
    ports:
      - "8001:8001"

  flights-service:
    build: ./flights-service
    container_name: flights-service
    restart: always
    depends_on:
      - postgres-db
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres-db:5432/airlinedb
    ports:
      - "8002:8002"

  bookings-service:
    build: ./bookings-service
    container_name: bookings-service
    restart: always
    depends_on:
      - mongodb-db
      - flights-service
      - auth-service
    environment:
      MONGODB_URI: mongodb://mongodb-db:27017/bookingsdb
    ports:
      - "8003:8003"

  payments-service:
    build: ./payments-service
    container_name: payments-service
    restart: always
    depends_on:
      - postgres-db
      - auth-service
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres-db:5432/airlinedb
    ports:
      - "8004:8004"

  airline-front:
    build: ./airline-front
    container_name: airline-front
    restart: always
    depends_on:
      - auth-service
      - flights-service
      - bookings-service
      - payments-service
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  mongo-data: